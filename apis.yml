aid: https://raw.githubusercontent.com/api-evangelist/noaa/refs/heads/main/apis.yml
name: NOAA
description: >-
  The National Oceanic and Atmospheric Administration (NOAA) provides a suite
  of publicly accessible REST APIs delivering weather observations, forecasts,
  alerts, climate data, ocean conditions, and historical environmental records
  from the US federal government. The National Weather Service API
  (api.weather.gov) offers real-time forecasts, active alerts, radar data,
  and observations across the continental United States and territories. NOAA
  also publishes the Climate Data Online (CDO) API for access to historical
  climate and weather datasets, the CO-OPS Tides and Currents API for water
  level and oceanographic data, and the Aviation Weather API for aeronautical
  weather products. All NOAA APIs are free to use as open government data with
  no licensing restrictions.
type: Index
accessModel:
  pricing: free
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Free · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/noaa.png
url: https://raw.githubusercontent.com/api-evangelist/noaa/refs/heads/main/apis.yml
created: '2026-06-12'
modified: '2026-06-12'
specificationVersion: '0.19'
tags:
  - Weather
  - Climate
  - Forecast
  - Alerts
  - Ocean
  - Tides
  - Aviation Weather
  - Government
  - Open Data
  - Environmental
apis:
- name: Climate Data Online (CDO) API
  description: >-
    The NOAA Climate Data Online Web Services API v2 provides RESTful access to the CDO database of historical
    weather and climate data maintained by the National Centers for Environmental Information (NCEI).
    Data types include daily summaries, normals, precipitation, temperatures, and storm events from thousands
    of global stations. Access requires a free token obtained by registering an email address with NCDC.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.ncdc.noaa.gov/cdo-web/webservices/v2
  baseURL: https://www.ncdc.noaa.gov/cdo-web/api/v2
  tags:
  - Climate
  - Historical Data
  - Weather Records
  - NCEI
  properties:
  - type: Documentation
    url: https://www.ncdc.noaa.gov/cdo-web/webservices/v2
  - type: TokenRequest
    url: https://www.ncdc.noaa.gov/cdo-web/token
- name: CO-OPS Tides and Currents API
  description: >-
    The NOAA Center for Operational Oceanographic Products and Services (CO-OPS) Data Retrieval API provides
    access to water levels, tide predictions, currents, and meteorological observations from hundreds
    of monitoring stations around US coasts and inland waterways. Additional metadata and derived product
    APIs complement the primary data retrieval service. The API is free and requires no authentication.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://tidesandcurrents.noaa.gov/api/
  baseURL: https://api.tidesandcurrents.noaa.gov/api/prod
  tags:
  - Tides
  - Currents
  - Water Levels
  - Ocean
  - Coastal
  properties:
  - type: Documentation
    url: https://tidesandcurrents.noaa.gov/api/
  - type: MetadataAPI
    url: https://api.tidesandcurrents.noaa.gov/mdapi/prod/
